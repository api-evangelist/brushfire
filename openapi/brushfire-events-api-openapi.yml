openapi: 3.2.0
info:
  title: 'Brushfire API: Version 2025-07-22 Events API'
  version: '2025-07-22'
  description: The Brushfire REST API provides programmatic access to the Brushfire event ticketing and registration platform.
  contact:
    name: Brushfire Developers
    url: https://developer.brushfire.com
servers:
- url: https://api.brushfire.com
  description: Brushfire API (date-versioned via the api-version header)
tags:
- name: Events
paths:
  /events:
    get:
      tags:
      - Events
      summary: Get a list of events for the specified user
      parameters:
      - name: accessKey
        in: query
        description: The Access Key for the user context
        schema:
          type: string
      - name: search
        in: query
        description: A string to filter events
        schema:
          type: string
      - name: inactive
        in: query
        description: Boolean pass in true to return inactive events.
        schema:
          type: boolean
          default: false
      - name: qty
        in: query
        description: An integer to limit the number of results returned
        schema:
          type: integer
          format: int32
      - name: skip
        in: query
        description: An integer to skip the first events returned
        schema:
          type: integer
          format: int32
      - name: archive
        in: query
        description: Boolean to return archived or not archvied events
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventListOutput'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventListOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: getEvents
      x-operation-id-source: derived
    post:
      tags:
      - Events
      summary: Create a fully complete event
      requestBody:
        description: The request body to create an event
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateInput'
          text/json:
            schema:
              $ref: '#/components/schemas/EventCreateInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventCreateInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetailsOutput'
            text/json:
              schema:
                $ref: '#/components/schemas/EventDetailsOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: postEvents
      x-operation-id-source: derived
  /events/{eventId}:
    delete:
      tags:
      - Events
      summary: Delete an event
      parameters:
      - name: accessKey
        in: query
        description: Access Key for user account
        schema:
          type: string
      - name: eventId
        in: path
        description: An integer or a GUID that corresponds to the specific event you would like to delete
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: deleteEventsByEventId
      x-operation-id-source: derived
    get:
      tags:
      - Events
      summary: Retrieve information for an event
      parameters:
      - name: eventId
        in: path
        description: An integer or a GUID that corresponds to a specific event
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSingleOutput'
            text/json:
              schema:
                $ref: '#/components/schemas/EventSingleOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: getEventsByEventId
      x-operation-id-source: derived
  /events/{eventId}/archive:
    post:
      tags:
      - Events
      summary: Queues the specified event for archiving.
      parameters:
      - name: eventId
        in: path
        description: An integer or a GUID that corresponds to a specific event
        required: true
        schema:
          type: string
      - name: accessKey
        in: query
        description: The Access Key for the user context
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: postEventsByEventIdArchive
      x-operation-id-source: derived
  /events/{eventId}/bestseats:
    get:
      tags:
      - Events
      summary: Returns the best available seats that match the supplied parameters for an…
      parameters:
      - name: eventId
        in: path
        description: An integer or a GUID that corresponds to a specific event
        required: true
        schema:
          type: string
      - name: quantity
        in: query
        description: Integer to find a quantity of seats
        schema:
          maximum: 1000
          minimum: 1
          type: integer
          format: int32
      - name: sectionId
        in: query
        description: An optional string (the exact name) or a GUID representing the section
        schema:
          type: string
      - name: accessKey
        in: query
        description: The Access Key for the user context
        schema:
          type: string
      - name: typeId
        in: query
        description: Optional GUID to find seats in a particular type
        schema:
          type: string
          format: uuid
      - name: groupId
        in: query
        description: An optional integer or a GUID that corresponds to a specific group
        schema:
          type: string
      - name: seatCode
        in: query
        description: An optional seat-level access code to unlock seats
        schema:
          type: string
      - name: nonconsecutive
        in: query
        description: Optional boolean to find seats that are non-consecutive
        schema:
          type: boolean
          default: false
      - name: basePrice
        in: query
        description: Optional decimal to find seats in a particular base price
        schema:
          type: number
          format: double
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSeatOutput'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSeatOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: getEventsByEventIdBestseats
      x-operation-id-source: derived
  /events/{eventId}/communities:
