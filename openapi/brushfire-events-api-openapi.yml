      operationId: getEventsByEventIdCommunities
      x-operation-id-source: derived
  /events/{eventId}/data:
    get:
      tags:
      - Events
      summary: Returns all data for the specified type
      parameters:
      - name: eventId
        in: path
        description: An integer or a GUID that corresponds to a specific event
        required: true
        schema:
          type: string
      - name: type
        in: query
        description: A string value of "Attendee", "Order", or "Group"
        schema:
          $ref: '#/components/schemas/FieldMetaType'
      - name: since
        in: query
        description: An optional date (UTC) from which to filter data
        schema:
          type: string
          format: date-time
      - name: includeCancelled
        in: query
        description: An optional boolean (default false) to include cancelled attendees
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {}
            text/json:
              schema: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: getEventsByEventIdData
      x-operation-id-source: derived
  /events/{eventId}/details:
