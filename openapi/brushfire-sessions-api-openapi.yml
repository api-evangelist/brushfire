openapi: 3.2.0
info:
  title: 'Brushfire API: Version 2025-07-22 Sessions API'
  version: '2025-07-22'
  description: The Brushfire REST API provides programmatic access to the Brushfire event ticketing and registration platform.
  contact:
    name: Brushfire Developers
    url: https://developer.brushfire.com
servers:
- url: https://api.brushfire.com
  description: Brushfire API (date-versioned via the api-version header)
tags:
- name: Sessions
paths:
  /sessions/{sessionId}:
    get:
      tags:
      - Sessions
      summary: Get detailed information about a given session
      parameters:
      - name: sessionId
        in: path
        description: An integer that corresponds to a specific session
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSessionOutput'
            text/json:
              schema:
                $ref: '#/components/schemas/EventSessionOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: getSessionsBySessionId
      x-operation-id-source: derived
  /sessions/{sessionId}/attendees:
    get:
      tags:
      - Sessions
      summary: Get a list of all of the attendees for a given check-in session
      parameters:
      - name: sessionId
        in: path
        description: The session number for which to retrieve attendees
        required: true
        schema:
          type: string
      - name: search
        in: query
        description: An optional search string for filtering attendees
        schema:
          type: string
          default: ''
      - name: qty
        in: query
        description: An integer to limit the number of results returned
        schema:
          type: integer
          format: int32
      - name: skip
        in: query
        description: An integer to skip the first attendees returned
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAttendeeListOutput'
            text/json:
              schema:
                $ref: '#/components/schemas/SessionAttendeeListOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: getSessionsBySessionIdAttendees
      x-operation-id-source: derived
  /sessions/{sessionId}/checkin:
    post:
      tags:
      - Sessions
      summary: Check in one or more attendees for a specific session
      parameters:
      - name: sessionId
        in: path
        description: An integer representing the session to check into
        required: true
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCheckinMultipleInput'
          text/json:
            schema:
              $ref: '#/components/schemas/SessionCheckinMultipleInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionCheckinMultipleInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionCheckinMultipleOutput'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionCheckinMultipleOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: postSessionsBySessionIdCheckin
      x-operation-id-source: derived
  /sessions/{sessionId}/checkout:
    post:
      tags:
      - Sessions
      summary: Check out one or more attendees for a specific session
      parameters:
      - name: sessionId
        in: path
        description: An integer representing the session to check out of
        required: true
        schema:
          type: string
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCheckoutMultipleInput'
          text/json:
            schema:
              $ref: '#/components/schemas/SessionCheckoutMultipleInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionCheckoutMultipleInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionCheckoutMultipleOutput'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionCheckoutMultipleOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: postSessionsBySessionIdCheckout
      x-operation-id-source: derived
  /sessions/{sessionId}/email/{email}:
    get:
      tags:
      - Sessions
      summary: Retrieve attendee data from a specific email and session
      parameters:
      - name: email
        in: path
        description: A string representing an email address
        required: true
        schema:
          type: string
      - name: sessionId
        in: path
        description: An integer representing a specific session
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionAttendeeOutput'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionAttendeeOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: getSessionsBySessionIdEmailByEmail
      x-operation-id-source: derived
  /sessions/{sessionId}/flex/{attendeeId}:
    get:
      tags:
      - Sessions
      summary: Get detailed information about a given flex attendee in a specific session
      parameters:
      - name: sessionId
        in: path
        description: An integer that corresponds to a specific session
        required: true
        schema:
          type: string
      - name: attendeeId
        in: path
        description: An integer that corresponds to a specific attendee
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendeeDetailsOutput'
            text/json:
              schema:
                $ref: '#/components/schemas/AttendeeDetailsOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: getSessionsBySessionIdFlexByAttendeeId
      x-operation-id-source: derived
  /sessions/{sessionId}/flex/checkin:
    post:
      tags:
      - Sessions
      summary: Checkin a flex pass attendee for a specific session
      parameters:
      - name: sessionId
        in: path
        description: An integer representing the session to check into
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionFlexPassCheckinInput'
          text/json:
            schema:
              $ref: '#/components/schemas/SessionFlexPassCheckinInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionFlexPassCheckinInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFlexPassCheckinOutput'
            text/json:
              schema:
                $ref: '#/components/schemas/SessionFlexPassCheckinOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: postSessionsBySessionIdFlexCheckin
      x-operation-id-source: derived
  /sessions/{sessionId}/flex/checkout:
    post:
      tags:
      - Sessions
      summary: Check out a flex pass attendee for a specific session
      parameters:
      - name: sessionId
        in: path
        description: An integer representing the session to check out of
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: ''
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionFlexPassCheckoutInput'
          text/json:
            schema:
              $ref: '#/components/schemas/SessionFlexPassCheckoutInput'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SessionFlexPassCheckoutInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionFlexPassCheckoutOutput'
            text/json:
              schema:
                $ref: '#/components/schemas/SessionFlexPassCheckoutOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: postSessionsBySessionIdFlexCheckout
      x-operation-id-source: derived
  /sessions/{sessionId}/groups/{groupId}:
    get:
      tags:
      - Sessions
      summary: Get all details, including checkin info for a group in a given session
      parameters:
      - name: groupId
        in: path
        description: An integer or GUID representing a specific group
        required: true
        schema:
          type: string
      - name: sessionId
        in: path
        description: An integer representing a specific session
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionGroupDetailOutput'
            text/json:
              schema:
                $ref: '#/components/schemas/SessionGroupDetailOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: getSessionsBySessionIdGroupsByGroupId
      x-operation-id-source: derived
  /sessions/{sessionId}/orders/{orderId}:
    get:
      tags:
      - Sessions
      summary: Retrieve Order and Buyer data from a specific order and session
      parameters:
      - name: orderId
        in: path
        description: A string (orderKey) or a GUID representing a specific order
        required: true
        schema:
          type: string
      - name: sessionId
        in: path
        description: An integer representing a specific session
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOrderDetailOutput'
            text/json:
              schema:
                $ref: '#/components/schemas/SessionOrderDetailOutput'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
            text/json:
              schema:
                $ref: '#/components/schemas/ApiModelError'
      security:
      - apiKey: []
      operationId: getSessionsBySessionIdOrdersByOrderId
      x-operation-id-source: derived
