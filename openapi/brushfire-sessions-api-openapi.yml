          type:
          - string
          - 'null'
        Type:
          type:
          - string
          - 'null'
        IsSensitive:
          type: boolean
        OptionIds:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
      additionalProperties: false
    SessionFlexPassCheckinOutput:
      type: object
      properties:
        Success:
          type: boolean
        Message:
          type:
          - string
          - 'null'
        CheckedInAt:
          type:
          - string
          - 'null'
          format: date-time
        AttendeeCheckinIds:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
        FlexRedemptions:
          type:
          - integer
          - 'null'
          format: int32
        FlexRedemptionsText:
