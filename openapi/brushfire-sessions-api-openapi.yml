          - integer
          - 'null'
          format: int32
        EventRedemptionsText:
          type:
          - string
          - 'null'
      additionalProperties: false
    SessionAttendeeOutput:
      type: object
      properties:
        AttendeeNumber:
          type: integer
          format: int64
        FirstName:
          type:
          - string
          - 'null'
        LastName:
          type:
          - string
          - 'null'
        SectionName:
          type:
          - string
          - 'null'
        RowName:
          type:
          - string
          - 'null'
        SeatLabel:
          type:
          - string
          - 'null'
        TypeName:
          type:
          - string
          - 'null'
        CheckedIn:
          type: boolean
        CheckedInAt:
          type:
          - string
          - 'null'
          format: date-time
        SeatInfo:
          type:
          - string
          - 'null'
          readOnly: true
        IsAddon:
          type: boolean
      additionalProperties: false
    SessionGroupDetailOutput:
